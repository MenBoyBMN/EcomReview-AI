services:
  db:
    image: postgres:16-alpine
    container_name: ecomreview_db
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_password
      POSTGRES_DB: ecomreview
    ports:
      - "5432:5432"
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_user -d ecomreview"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: ecomreview_api
    environment:
      DEMO_CACHE_MODE: "true"
      ECOMREVIEW_SQLITE_PATH: "/app/data/ecomreview.db"
      DATABASE_URL: "postgresql://ecom_user:ecom_password@db:5432/ecomreview"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: ecomreview_ui
    environment:
      DEMO_CACHE_MODE: "true"
      ECOMREVIEW_SQLITE_PATH: "/app/data/ecomreview.db"
      API_BASE_URL: "http://api:8000"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      - api

volumes:
  pgdata:

