[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomreview"
version = "0.1.0"
description = "EcomReview AI: Automated Vietnamese Feedback Analysis & Action Planning Backend for SMEs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Abount_System", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

