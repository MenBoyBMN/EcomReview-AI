# Domain Playbook: Áo Mưa Thời Trang & Tiện Lợi (Shopee & TikTok Shop)
domain: "raincoat_ecommerce_vn"
version: "1.0.0"

guardrails:
  overclaim_keywords:
    - "chống thấm 100%"
    - "chống nước tuyệt đối"
    - "không bao giờ thấm"
    - "vĩnh viễn không rách"
    - "bảo hành trọn đời"
  prohibited_policy_keywords:
    - "tặng tiền đổi 5 sao"
    - "hoàn tiền nếu đánh giá 5 sao"
    - "xóa đánh giá 1 sao"
    - "mua hộ đánh giá ảo"
    - "chuyển khoản ngoài sàn"
    - "zalo cá nhân để nhận hoàn tiền"
  deadline_keywords:
    - "giờ"
    - "ngày"
    - "tuần"
    - "24h"
    - "48h"
    - "72h"
    - "ngay"
    - "trong vòng"

playbook_rules:
  - rule_id: "PB_01"
    aspect: "WATERPROOF"
    trigger: "TOP_PAIN"
    action_type: "PRODUCT_FIX"
    is_marketing: false
    title: "Gia cố băng keo ép nhiệt đường may đáy quần và nẹp khóa kéo"
    what_to_do: "Kiểm tra lô hàng tồn kho và yêu cầu xưởng tăng nhiệt độ ép seam tape PVC/PU tại đường may ngã tư đáy quần và dọc nẹp che khóa kéo ngực."
    how_and_when: "Thực hiện kiểm định ngẫu nhiên 20 mẫu dưới vòi xịt áp lực trong vòng 48h trước khi xuất kho lô mới."
    success_metric: "Giảm tỷ lệ phàn nàn thấm nước đường may xuống dưới 15% trong 14 ngày tới."
    effort: "HIGH"
    impact: "HIGH"

  - rule_id: "PB_02"
    aspect: "WATERPROOF"
    trigger: "TOP_PAIN"
    action_type: "LISTING_UPDATE"
    is_marketing: true
    title: "Cập nhật hướng dẫn gài nẹp chắn nước 2 lớp trên ảnh mô tả sản phẩm"
    what_to_do: "Bổ sung Infographic ở ảnh số 3 trên Shopee/TikTok hướng dẫn khách kéo khóa trong và bấm kín hàng cúc bấm nẹp ngoài để tránh nước tạt ngang khi đi xe máy."
    how_and_when: "Thiết kế và cập nhật lên trang sản phẩm trong vòng 24h."
    success_metric: "Giảm câu hỏi/phàn nàn về nước tạt qua khóa kéo ít nhất 20% sau 2 tuần."
    effort: "LOW"
    impact: "MEDIUM"

  - rule_id: "PB_03"
    aspect: "MATERIAL_DURABILITY"
    trigger: "TOP_PAIN"
    action_type: "OPS"
    is_marketing: false
    title: "Khử mùi nhựa PVC/PU và kiểm tra độ bền khuy bấm trước khi đóng gói"
    what_to_do: "Phơi thoáng khí lô áo mưa mới sản xuất tại kho 24h để bay hết mùi nhựa nồng và kiểm tra lực bấm của hàng khuy nhựa/đồng."
    how_and_when: "Áp dụng ngay cho quy trình QC đầu vào trong vòng 48h."
    success_metric: "Giảm 50% phản hồi tiêu cực về mùi nhựa và bung cúc trong 7 ngày."
    effort: "MEDIUM"
    impact: "HIGH"

  - rule_id: "PB_04"
    aspect: "MATERIAL_DURABILITY"
    trigger: "STRENGTH"
    action_type: "CONTENT"
    is_marketing: true
    title: "Sản xuất video TikTok/Reels test độ dẻo dai vải dù tổ ong / da cá"
    what_to_do: "Quay video thực tế kéo căng vải áo mưa và thử nghiệm dưới mưa rào để làm nổi bật ưu điểm chất vải dày dặn, mềm mại được khách khen ngợi."
    how_and_when: "Đăng tải video lên kênh TikTok Shop và gắn vào đầu trang Shopee trong vòng 3 ngày."
    success_metric: "Tăng tỷ lệ chuyển đổi (CR) trang sản phẩm thêm 1.5% trong 2 tuần."
    effort: "LOW"
    impact: "HIGH"

  - rule_id: "PB_05"
    aspect: "FIT_SIZE"
    trigger: "TOP_PAIN"
    action_type: "LISTING_UPDATE"
    is_marketing: true
    title: "Chuẩn hóa bảng quy đổi Size theo chiều cao, cân nặng và nhu cầu đeo balo"
    what_to_do: "Cập nhật bảng Size khuyên dùng tăng 1 size (từ XL lên 2XL) cho khách cao trên 1m68 hoặc thường xuyên đeo balo laptop khi đi xe máy."
    how_and_when: "Chỉnh sửa ảnh bảng Size và phần mô tả sản phẩm trong vòng 24h."
    success_metric: "Giảm tỷ lệ đổi trả/phàn nàn do chật hoặc ngắn tà áo xuống dưới 10% trong 14 ngày."
    effort: "LOW"
    impact: "HIGH"

  - rule_id: "PB_06"
    aspect: "COMFORT_USABILITY"
    trigger: "TOP_PAIN"
    action_type: "CUSTOMER_CARE"
    is_marketing: true
    title: "Gửi kèm thẻ hướng dẫn bóc lớp màng bảo vệ kính chắn mưa"
    what_to_do: "In thẻ hướng dẫn nhỏ đặt trong túi áo mưa nhắc khách bóc lớp nilon mờ bảo vệ 2 mặt kính chắn nước trước khi sử dụng."
    how_and_when: "Triển khai đính kèm vào mọi đơn hàng xuất kho trong vòng 72h."
    success_metric: "Loại bỏ 80% hiểu lầm rằng kính chắn mưa bị mờ/trầy xước trong 2 tuần."
    effort: "LOW"
    impact: "MEDIUM"

  - rule_id: "PB_07"
    aspect: "PRICE_VALUE"
    trigger: "TOP_PAIN"
    action_type: "PROMOTION"
    is_marketing: true
    title: "Thiết lập Combo Mua 2 Giảm 10% kèm túi đựng chống thấm cùng màu"
    what_to_do: "Tạo chương trình Mua kèm Deal sốc / Combo 2 áo mưa gia đình để gia tăng cảm nhận giá trị tương xứng với mức giá bán."
    how_and_when: "Cấu hình trên Kênh Người Bán Shopee và TikTok Seller Center trong vòng 24h."
    success_metric: "Tăng giá trị đơn hàng trung bình (AOV) thêm 15% trong 7 ngày."
    effort: "LOW"
    impact: "MEDIUM"

  - rule_id: "PB_08"
    aspect: "PACKAGING_SHIPPING"
    trigger: "TOP_PAIN"
    action_type: "OPS"
    is_marketing: false
    title: "Nâng cấp túi đóng gói PE 2 lớp chống rách và đối soát mã màu bằng máy quét"
    what_to_do: "Sử dụng túi niêm phong PE dày hơn và quét barcode phân loại màu/size trước khi dán vận đơn để chấm dứt lỗi giao nhầm màu."
    how_and_when: "Áp dụng tại bàn đóng gói kho vận trong vòng 48h."
    success_metric: "Giảm tỷ lệ giao sai màu/rách bao bì xuống dưới 2% trong 14 ngày."
    effort: "MEDIUM"
    impact: "HIGH"

  - rule_id: "PB_09"
    aspect: "CUSTOMER_SERVICE"
    trigger: "TOP_PAIN"
    action_type: "REVIEW_REPLY"
    is_marketing: true
    title: "Phản hồi cá nhân hóa và kích hoạt bảo hành đổi mới 1-1 cho đánh giá 1-3 sao"
    what_to_do: "Soạn phản hồi xin lỗi chân thành ngay dưới đánh giá tiêu cực và chủ động nhắn tin qua Chat của sàn để gửi bù sản phẩm mới hoặc đổi size miễn phí."
    how_and_when: "Xử lý toàn bộ đánh giá tiêu cực tồn đọng trong vòng 24h."
    success_metric: "Đạt 100% tỷ lệ phản hồi đánh giá tiêu cực trong 24h và cải thiện điểm đánh giá shop."
    effort: "LOW"
    impact: "HIGH"

  - rule_id: "PB_10"
    aspect: "ACCESSIBILITY_DESIGN"
    trigger: "STRENGTH"
    action_type: "CONTENT"
    is_marketing: true
    title: "Làm nổi bật bộ sưu tập màu Pastel Hàn Quốc và dải phản quang an toàn ban đêm"
    what_to_do: "Đưa hình ảnh khách hàng thực tế mặc các màu Pastel thời trang lên đầu thư viện ảnh và nhấn mạnh tính năng dải phản quang sau lưng."
    how_and_when: "Cập nhật bộ ảnh bìa và video ghim trong vòng 48h."
    success_metric: "Tăng tỷ lệ nhấp (CTR) vào sản phẩm thêm 2% trong 14 ngày."
    effort: "LOW"
    impact: "HIGH"

  - rule_id: "PB_11"
    aspect: "MATERIAL_DURABILITY"
    trigger: "HIDDEN_COMPLAINT"
    action_type: "CUSTOMER_CARE"
    is_marketing: true
    title: "Chăm sóc chủ động nhóm khách chấm 4-5 sao nhưng góp ý về chất liệu/độ dày"
    what_to_do: "Gửi tin nhắn cảm ơn kèm mã giảm giá lần mua sau và hướng dẫn bảo quản áo mưa (không phơi nắng gắt, gấp gọn sau khi rũ khô) để tăng tuổi thọ vải."
    how_and_when: "Thiết lập tin nhắn tự động sau giao hàng thành công trong vòng 48h."
    success_metric: "Tăng tỷ lệ khách hàng quay lại mua lần 2 thêm 10% trong 30 ngày."
    effort: "LOW"
    impact: "MEDIUM"

  - rule_id: "PB_12"
    aspect: "MATERIAL_DURABILITY"
    trigger: "PLATFORM_GAP"
    action_type: "LISTING_UPDATE"
    is_marketing: true
    title: "Đồng bộ thông số định lượng vải (GSM) và độ dày giữa Shopee và TikTok Shop"
    what_to_do: "Rà soát và thống nhất mô tả độ dày vải (mm/GSM) trên cả hai sàn để tránh kỳ vọng sai lệch của khách mua qua livestream hoặc mô tả văn bản."
    how_and_when: "Rà soát và cập nhật đồng bộ trên cả 2 sàn trong vòng 24h."
    success_metric: "Thu hẹp chênh lệch tỷ lệ phàn nàn giữa Shopee và TikTok xuống dưới 10% sau 2 tuần."
    effort: "LOW"
    impact: "MEDIUM"

