name: CI

on:
  push:
    branches: [main, hoan-thien-a-b]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecom_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ecomreview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom_user -d ecomreview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ECOMREVIEW_TEST_PG_URL: "postgresql://ecom_user:ci_password@localhost:5432/ecomreview"
      DEMO_CACHE_MODE: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Lint Check (Ruff)
        run: |
          ruff check .
          ruff format . --check

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v

